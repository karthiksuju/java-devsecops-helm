replicaCount: 2

image:
  repository: karthiksindhu/java-devsecops-app
  pullPolicy: IfNotPresent
  tag: "1"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}

podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: LoadBalancer
  port: 8081

ingress:
  enabled: false

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: 8081

readinessProbe:
  httpGet:
    path: /
    port: 8081

autoscaling:
  enabled: false

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
